- gap_id: GAP-008
  target_names:
  - gpu_intercept
  - gpu_male
  - gpu_age
  - gpu_age2
  source_items:
  - KR-U04
  description: General-population utility norms by age and sex not supplied (KR-U04 empty); UK norms regression
    retained.
  class: partial
  handling: retain_flagged
  retained_source: fixtures/global_model.xlsx
  rationale: The age-adjustment structure transfers but the calibration is population-specific; UK norms combined
    with Korean state utilities are flagged as a limitation.
  escalation_options:
  - option_id: E1
    action: cite_local_literature
    description: Cite Korean EQ-5D population norms and re-estimate the regression with an approved method.
  - option_id: E2
    action: approved_method_change
    description: Switch off age adjustment of utilities as an approved scenario if no Korean norms exist.
  - option_id: E3
    action: retain_with_scenario
    description: Retain UK norms with a scenario without age adjustment.
  prohibited_options:
  - Shift the UK norms by the difference between Korean and UK state utilities
  decided_by:
    kind: agent
    role: Input Mapper
  status: open
  resolution: null
- gap_id: GAP-009
  target_names:
  - lt_qx_male
  source_items:
  - KR-L01
  description: Korean male life table is supplied as central death rates (mx) by single age ending in an open top
    band, while the model needs qx by single age to its maximum age.
  class: partial
  handling: retain_flagged
  retained_source: KR-L01
  rationale: The life table structure transfers and the Korean rates are used; the mx-to-qx conversion method and
    carrying the open-band rate to older single ages are assumptions flagged for review.
  escalation_options:
  - option_id: E1
    action: obtain_local_data
    description: Obtain the Korean complete life table with qx by single age to the oldest age.
  - option_id: E2
    action: approved_method_change
    description: Approve an old-age mortality extrapolation model (e.g. Kannisto) for ages in the open band.
  prohibited_options:
  - Use UK qx for ages in the Korean open band
  - Truncate the model horizon to the last single Korean age
  decided_by:
    kind: agent
    role: Input Mapper
  status: open
  resolution: null
